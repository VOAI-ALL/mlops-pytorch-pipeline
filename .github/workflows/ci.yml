name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements/dev.txt
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Validate YAML files
        run: python -c "from pathlib import Path; import yaml; files=list(Path('configs').glob('*.yaml'))+list(Path('k8s').glob('*.yaml')); [list(yaml.safe_load_all(p.read_text(encoding='utf-8'))) for p in files]; print(f'validated {len(files)} YAML files')"
      - name: Run unit tests
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build training image
        run: docker build -f docker/Dockerfile.train -t mlops-train:ci .
      - name: Build serving image
        run: docker build -f docker/Dockerfile.serve -t mlops-serve:ci .

